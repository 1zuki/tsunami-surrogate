configs:
  bathymetry: configs/bathymetry.yaml
  source: configs/source.yaml
dataset:
  num_samples: 100
  n_steps: 200
  save_every: 5
  auto_dt: true
  target_cfl: 0.45
  include_initial_state: true
  sea_level_offset: 0.0
  source_strength_range:
  - 0.5
  - 2.0
  output_dir: data/raw
  manifest_path: data/synthetic/manifest.jsonl
  copy_configs: true
solver:
  nx: 64
  ny: 64
  dx: 0.00390625
  dy: 0.00390625
  dt: 0.001
  g: 9.81
  rho: 1000
  cfl: 0.45
  dry_tolerance: 1e-6
  boundary: open
  use_sponge: true
  sponge_width: 20
  sponge_min_factor: 0.9
