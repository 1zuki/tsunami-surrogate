seed: 42
device: cuda
output_dir: experiments/sample_scaling/n_000250
data:
  train_path: data/processed/hydrostatic/train/eval_dataset.npz
  val_path: data/processed/hydrostatic/val/eval_dataset.npz
  test_path: data/processed/hydrostatic/test/eval_dataset.npz
  n_samples: 250
  val_samples: null
  test_samples: null
  batch_size: 64
  num_workers: 4
model:
  name: fno2d
  in_channels: 3
  out_channels: 50
  modes1: 14
  modes2: 14
  width: 48
  depth: 6
  padding: 6
  use_grid: true
train:
  epochs: 256
  lr: 0.0005
  weight_decay: 1.0e-06
  loss: horizon_weighted_mse
  grad_clip: 1.0
  checkpoint_metric: val_rel_l2
  early_stopping:
    patience: 20
    mode: min
  min_lr: 5.0e-05
  scheduler: cosine
  horizon_min_weight: 0.8
  horizon_max_weight: 2.0
  horizon_power: 1.7
eval:
  dataset_path: data/processed/hydrostatic/test
  batch_size: 64
  output_dir: experiments/sample_scaling/n_000250/eval
  warmup_steps: 5
  timed_steps: 20
ensemble:
  seeds:
  - 11
  - 22
  - 33
  member_dir_template: experiments/ensemble/member_{seed}
resolution_transfer:
  eval_resolutions:
  - 32
  - 64
uncertainty:
  ensemble_checkpoints: []
  interval_levels:
  - 0.5
  - 0.8
  - 0.9
  - 0.95
sample_scaling:
  base_config: configs/model/fno.yaml
  requested_train_samples: 250
