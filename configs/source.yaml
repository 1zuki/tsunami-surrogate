
nx: 64
ny: 64
seed: null

types: ["gaussian", "multi_gaussian", "dipole", "fault"]

gaussian:
  amp_range: [0.1, 2.0]
  sigma_range: [2.0, 10.0]

multi_gaussian:
  num_range: [2, 5]
  amp_range: [0.1, 1.5]
  sigma_range: [2.0, 8.0]

dipole:
  amp_range: [0.2, 2.0]
  distance_range: [0.05, 0.2]

fault:
  amp_range: [0.5, 2.5]
  length_range: [0.1, 0.5]
  width_range: [0.02, 0.1]
  angle_range: [0, 3.14]

normalization:
  max_amplitude: 1.0