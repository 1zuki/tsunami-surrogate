base_config: base.yaml

project:
  name: tsunami-cnn

paths:
  output_root: results/cnn_run
  checkpoint_dir: results/cnn_run/checkpoints
  log_dir: results/cnn_run/logs
  figure_dir: results/cnn_run/figures
  dataset_dir: data/synthetic/fno_default
  train_file: data/synthetic/fno_default/train.npz
  val_file: data/synthetic/fno_default/val.npz
  test_file: data/synthetic/fno_default/test.npz
  stats_file: data/synthetic/fno_default/stats.yaml

model:
  name: cnn
  hidden_channels: 32
  n_blocks: 8
  dropout: 0.10

training:
  epochs: 60
  batch_size: 4
  lr: 0.001
