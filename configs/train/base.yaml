seed: 42
device: auto

output_dir: experiments/default

data:
  train_path: data/processed/hydrostatic/train/eval_dataset.npz
  val_path: data/processed/hydrostatic/val/eval_dataset.npz
  test_path: data/processed/hydrostatic/test/eval_dataset.npz
  n_samples: null        # optional train-subset size for sample-scaling experiments
  val_samples: null      # optional validation subset size
  test_samples: null     # optional test subset size
  # RTX 4050 laptop default: enough batch to keep GPU busy, without overdriving
  # compressed shard loading or leaving too little VRAM headroom.
  batch_size: 64
  num_workers: 4

model:
  name: fno2d
  in_channels: 3
  out_channels: 100
  modes1: 12
  modes2: 12
  width: 32
  depth: 4
  padding: 6
  use_grid: true

train:
  epochs: 256
  lr: 0.001
  weight_decay: 1.0e-6
  loss: mse
  grad_clip: null
  checkpoint_metric: val_rel_l2
  early_stopping:
    patience: 10
    mode: min

eval:
  dataset_path: data/processed/hydrostatic/test
  batch_size: 64
  output_dir: experiments/eval
  warmup_steps: 5
  timed_steps: 20

ensemble:
  seeds: [11, 22, 33]
  member_dir_template: experiments/ensemble/member_{seed}

resolution_transfer:
  eval_resolutions: [32, 64]

uncertainty:
  ensemble_checkpoints: []
  interval_levels: [0.5, 0.8, 0.9, 0.95]
