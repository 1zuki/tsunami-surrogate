raw:
  publication_split: eval
  scenario_manifest: data/eval/synthetic/scenario_manifest.jsonl
  fde_manifests:
    hydrostatic: data/eval/synthetic/hydrostatic_manifest.jsonl
    muscl_hr: data/eval/synthetic/muscl_hr_manifest.jsonl
    boussinesq: data/eval/synthetic/boussinesq_manifest.jsonl
  raw_dirs:
    hydrostatic: data/eval/raw/hydrostatic/samples
    muscl_hr: data/eval/raw/muscl_hr/samples
    boussinesq: data/eval/raw/boussinesq/samples

processed_dir: data/processed

fde:
  mode: separate_all
  targets: [hydrostatic, muscl_hr, boussinesq]
  target_field: eta

split:
  train: 0
  val: 1
  test: 0
  seed: 42

input:
  use_bathymetry: true
  use_source: true
  use_initial_depth: true
  use_initial_surface: false
  use_solver_id: false

target:
  mode: multi_step
  variable: eta
  forecast_steps: 50
  stride: 1

normalization:
  method: standardize
  # Validation reuses the statistics fitted by preprocess_train.yaml.
  reference_stats_by_fde:
    hydrostatic: data/processed/hydrostatic/normalization_stats.json
    muscl_hr: data/processed/muscl_hr/normalization_stats.json
    boussinesq: data/processed/boussinesq/normalization_stats.json
  channels:
    bathymetry: true
    source: true
    solver_id: false
    trajectory: true
  eps: 1e-6

saving:
  format: npy
  compress: true
  include_meta: true
  sharded: true
  shard_size: 128
  write_legacy_val_archive: false
  publication_mode: merge_split

val_export:
  enabled: true
  input_order: [bathymetry, source, initial_depth, initial_surface]
  inputs_name: inputs.npy
  targets_name: targets.npy
  ids_name: sample_id.npy
  archive_name: eval_dataset.npz
  manifest_name: eval_manifest.json
