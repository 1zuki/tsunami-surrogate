nx: 64
ny: 64
seed: null

source_type: ["gaussian", "multi-gauss", "dipole"]

gaussian:
  enabled: true
  amp_range: [0.15, 0.8]
  sigma_range: [0.08, 0.18]
  num_range: [1, 3]

multi:
  enabled: true
  num_sources: [1, 3]

okada:
  enabled: false
  length_range: [0.1, 0.4]
  width_range: [0.05, 0.2]
  slip_range: [0.5, 2.0]
  angle_range: [0.0, 3.14]
  dip_range: [0.0, 0.5]
  depth_range: [0.0, 0.2]
  smoothing_sigma: [0.01, 0.03]

dipole:
  enabled: true
  amp_range: [0.15, 0.8]
  sigma_range: [0.08, 0.16]
  separation_range: [0.05, 0.20]
  angle_range: [0.0, 3.14]

fault:
  enabled: false
  amp_range: [0.3, 1.0]
  length_range: [0.2, 0.6]
  width_range: [0.02, 0.08]
  angle_range: [0.0, 3.14]
  smoothing_sigma: [0.01, 0.03]

rough:
  enabled: false
  amp_range: [0.3, 1.0]
  smoothing_sigma: [1.0, 3.0]

noise:
  enabled: true
  scale_range: [0.0, 0.02]
  smoothing_sigma: [1.5, 3.0]

normalization:
  mode: none
  clip_output: false
  height_scale: [-1.0, 1.0]
