raw:
  scenario_manifest: /mnt/Windows/Users/Izu/tsunami-surrogate/data/train/synthetic/scenario_manifest.jsonl
  fde_manifests:
    hydrostatic: /mnt/Windows/Users/Izu/tsunami-surrogate/data/train/synthetic/hydrostatic_manifest.jsonl
    muscl_hr: /mnt/Windows/Users/Izu/tsunami-surrogate/data/train/synthetic/muscl_hr_manifest.jsonl
    boussinesq: /mnt/Windows/Users/Izu/tsunami-surrogate/data/train/synthetic/boussinesq_manifest.jsonl
  raw_dirs:
    hydrostatic: /mnt/Windows/Users/Izu/tsunami-surrogate/data/train/raw/hydrostatic/samples
    muscl_hr: /mnt/Windows/Users/Izu/tsunami-surrogate/data/train/raw/muscl_hr/samples
    boussinesq: /mnt/Windows/Users/Izu/tsunami-surrogate/data/train/raw/boussinesq/samples

processed_dir: data/processed/eval

fde:
  mode: separate_all          # single / separate_all / multifidelity
  targets: ["hydrostatic", "muscl_hr", "boussinesq"]
  target_field: eta     # eta / depth / state

split:
  train: 1
  val: 0
  test: 0
  seed: 42

input:
  use_bathymetry: true
  use_source: true
  use_initial_depth: true
  use_initial_surface: false
  # if omitted, defaults to true when fde.mode == multifidelity.
  use_solver_id: false

target:
  mode: multi_step      # next_step / multi_step / final_state
  variable: eta         # eta / depth / state
  forecast_steps: 50
  stride: 1

normalization:
  method: standardize   # standardize / minmax
  channels:
    bathymetry: true
    source: true
    solver_id: false
    trajectory: true
  eps: 1e-6

saving:
  format: npy
  compress: true
  include_meta: true
  sharded: true
  shard_size: 128
  write_legacy_train_archive: false

train_export:
  enabled: true
  input_order: [bathymetry, source, initial_depth, initial_surface]
  inputs_name: inputs.npy
  targets_name: targets.npy
  ids_name: sample_id.npy
  archive_name: train_dataset.npz
  manifest_name: train_manifest.json
