raw:
  scenario_manifest: data/synthetic/scenario_manifest.jsonl
  fde_manifests:
    hydrostatic: data/synthetic/hydrostatic_manifest.jsonl
    muscl_hr: data/synthetic/muscl_hr_manifest.jsonl
    boussinesq: data/synthetic/boussinesq_manifest.jsonl
  raw_dirs:
    hydrostatic: data/raw/hydrostatic/samples
    muscl_hr: data/raw/muscl_hr/samples
    boussinesq: data/raw/boussinesq/samples

processed_dir: data/processed

fde:
  mode: separate_all          # single / separate_all / multifidelity
  targets: [hydrostatic, muscl_hr]
  target_field: eta     # eta / depth / state

split:
  train: 0.7
  val: 0.15
  test: 0.15
  seed: 42

input:
  use_bathymetry: true
  use_source: true
  use_initial_depth: true
  use_initial_surface: false
  # if omitted, defaults to true when fde.mode == multifidelity.
  use_solver_id: false

target:
  mode: multi_step      # next_step / multi_step / final_state
  variable: eta         # eta / depth / state
  forecast_steps: 50
  stride: 1

normalization:
  method: standardize   # standardize / minmax
  channels:
    bathymetry: true
    source: true
    solver_id: false
    trajectory: true
  eps: 1e-6

saving:
  format: npy
  compress: true
  include_meta: true

eval_export:
  enabled: true
  input_order: [bathymetry, source, initial_depth, initial_surface]
  inputs_name: inputs.npy
  targets_name: targets.npy
  ids_name: sample_id.npy
  archive_name: eval_dataset.npz
  manifest_name: eval_manifest.json
