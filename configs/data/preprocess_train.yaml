raw:
  publication_split: train
  generation_config: configs/data/dataset.yaml
  scenario_manifest: data/train/synthetic/scenario_manifest.jsonl
  fde_manifests:
    hydrostatic: data/train/synthetic/hydrostatic_manifest.jsonl
    muscl_hr: data/train/synthetic/muscl_hr_manifest.jsonl
    boussinesq: data/train/synthetic/boussinesq_manifest.jsonl
  raw_dirs:
    hydrostatic: data/train/raw/hydrostatic/samples
    muscl_hr: data/train/raw/muscl_hr/samples
    boussinesq: data/train/raw/boussinesq/samples

processed_dir: data/processed

fde:
  mode: separate_all
  targets: [hydrostatic, muscl_hr, boussinesq]
  target_field: eta

split:
  train: 1
  val: 0
  test: 0
  seed: 42

input:
  use_bathymetry: true
  use_source: true
  use_initial_depth: true
  use_initial_surface: false
  use_solver_id: false

target:
  mode: multi_step
  variable: eta
  forecast_steps: 50
  stride: 1

normalization:
  method: standardize
  channels:
    bathymetry: true
    source: true
    solver_id: false
    trajectory: true
  eps: 1e-6

saving:
  format: npy
  compress: true
  include_meta: true
  sharded: true
  shard_size: 128
  write_legacy_train_archive: false
  publication_mode: replace

train_export:
  enabled: true
  input_order: [bathymetry, source, initial_depth, initial_surface]
  inputs_name: inputs.npy
  targets_name: targets.npy
  ids_name: sample_id.npy
  archive_name: eval_dataset.npz
  manifest_name: eval_manifest.json
