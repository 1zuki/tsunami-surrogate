configs:
  bathymetry: configs/data/rebuild/bathymetry_64.yaml
  source: configs/data/rebuild/source_64.yaml

dataset:
  num_samples: 2500
  seed: 911
  num_workers: 8
  n_steps: 250
  save_every: 5
  auto_dt: true
  target_cfl: 0.45
  include_initial_state: true
  sea_level_offset: 0.0
  source_strength_range: [0.15, 0.30]
  max_initial_eta_over_depth: 0.10
  bathymetry_dir: rebuild/aspect2400-roughgrf-r1/data/test/bathymetry
  source_dir: rebuild/aspect2400-roughgrf-r1/data/test/sources
  output_dir: rebuild/aspect2400-roughgrf-r1/data/test/raw
  manifest_path: rebuild/aspect2400-roughgrf-r1/data/test/synthetic/scenario_manifest.jsonl
  copy_configs: true

requested_output:
  enabled: true
  schema_id: tsunami-surrogate.common-time-v2.contract.v1
  status: accepted
  execution_scope: production
  split: test
  start: 8.4
  step: 8.4
  count: 50
  horizon: 420.0
  max_natural_steps: 20000
  collect_natural_step_health: true
  eta_primary: true
  debug_full_states: false
  acknowledge_provisional: false
  physical_scaling:
    horizontal_scale: 2400.0
    time_scale: 2400.0
    vertical_scale: 1.0
    aspect_ratio: 2400.0
    length_unit: m
    time_unit: s

paired_inputs:
  enabled: true
  lineage_id: aspect2400-roughgrf-r1-test-seed911-master384-solver128
  master_shape: [384, 384]
  solver_shape: [128, 128]
  target_shape: [64, 64]
  downsample_method: block_mean_float64_v1
  master_bathymetry_config: configs/data/rebuild/bathymetry_384.yaml
  master_source_config: configs/data/rebuild/source_384.yaml
  inventory_path: rebuild/aspect2400-roughgrf-r1/data/test/synthetic/native_input_inventory.jsonl
  solver_input: solver
  source_taper_stage: master
  rough_zero_mean_rms_after_taper: true
  source_spectral_acceptance:
    enabled: true
    stage: post_master_taper_solver
    reference_shape: [128, 128]
    min_points_per_p90_wavelength: 32.0
    comparison_tolerance: 1.0e-9
    preserve_source_family: true
    max_attempts: 64

computational_domain:
  enabled: true
  buffer_cells: 32
  source_taper_cells: 16
  bathymetry_extension: edge
  output_crop: central

fdes:
  enabled: [swe_hydrostatic, swe_muscl_hr, boussinesq]
  primary: swe_hydrostatic

solver_profiles:
  swe_hydrostatic:
    cfl: 0.1125
    boundary: radiation
    sponge_time_mode: elapsed_time_consistent
    sponge_reference_dt: 8.4
  swe_muscl_hr:
    cfl: 0.225
    boundary: radiation
    sponge_time_mode: elapsed_time_consistent
    sponge_reference_dt: 8.4
  boussinesq:
    cfl: 0.35
    boundary: open
    depth_scale: 1.0
    linear_solver_preconditioner: sparse_lu
    sponge_time_mode: elapsed_time_consistent
    sponge_reference_dt: 8.4
    filter_time_mode: disabled
    filter_reference_dt: 8.4
    cg_failure_mode: strict_v2

operations:
  enabled: true
  progress_every: 1
  solver_progress: true
  max_in_flight: 8

quality:
  on_violation: fail
  reject_nonfinite: true
  min_h_tolerance: -1.0e-6
  max_abs_eta_limit: 5.0
  max_velocity_limit: 30.0
  max_eta_over_depth: 1.0
  require_cg_converged: true
  reject_sanitization: true
  require_no_projection: true
  require_no_velocity_clipping: true
  max_post_step_cfl_ratio: 1.01

solver:
  nx: 192
  ny: 192
  dx: 18.75
  dy: 18.75
  dt: 2.4
  g: 9.81
  rho: 1000
  cfl: 0.45
  dry_tolerance: 1.0e-6
  max_velocity: 30.0
  boundary: open
  use_sponge: true
  sponge_width: 32
  sponge_min_factor: 0.8
  sponge_axes: xy
  sponge_profile: cosine
  alpha: 0.3333333333333333
  min_depth: 1.0e-4
  depth_scale: 1.0
  mode: linear_variable_depth
  filter_strength: 0.0
  linear_solver_tol: 1.0e-10
  linear_solver_abs_tol: 0.0
  linear_solver_max_iter: 750
  check_finite: true
