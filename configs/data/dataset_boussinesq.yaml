configs:
  bathymetry: "configs/data/bathymetry_boussinesq.yaml"
  source: "configs/data/source_boussinesq.yaml"

dataset:
  num_samples: 50
  seed: 42
  num_workers: 10
  n_steps: 250
  save_every: 5
  auto_dt: true
  target_cfl: 0.35
  include_initial_state: true
  sea_level_offset: 0.0
  source_strength_range: [0.01, 0.05]
  bathymetry_dir: "data/bathymetry_bouss"
  source_dir: "data/sources_bouss"
  output_dir: "data/raw_bouss"
  manifest_path: "data/synthetic/scenario_manifest_bouss.jsonl"
  copy_configs: true

fdes:
  enabled: ["boussinesq"]
  primary: "boussinesq"

solver:
  nx: 64
  ny: 64
  dx: 0.015625
  dy: 0.015625
  dt: 0.001
  g: 9.81
  cfl: 0.35
  boundary: "open"
  use_sponge: true
  sponge_width: 12
  sponge_min_factor: 0.92
  alpha: 0.3333333333333333
  min_depth: 1e-4
  depth_scale: 0.02
  mode: "linear_variable_depth"
  filter_strength: 0.01
  linear_solver_tol: 1e-8
  linear_solver_max_iter: 120
  check_finite: true
