# LEGACY SAVED-STEP DIAGNOSTIC. Not common-time production. Invoke only with
# `python scripts/make_dataset.py legacy-v1 --config ...`.
configs:
  bathymetry: "configs/data/bathymetry_boussinesq.yaml"
  source: "configs/data/source_boussinesq.yaml"

dataset:
  num_samples: 100
  seed: 42
  num_workers: 10
  n_steps: 250
  save_every: 5
  auto_dt: true
  target_cfl: 0.35
  include_initial_state: true
  sea_level_offset: 0.0
  source_strength_range: [0.01, 0.05]
  bathymetry_dir: "./data/bouss_debug/bathymetry"
  source_dir: "./data/bouss_debug/sources"
  output_dir: "./data/bouss_debug/raw"
  manifest_path: "./data/bouss_debug/synthetic/scenario_manifest.jsonl"
  copy_configs: true

fdes:
  enabled: ["boussinesq"]
  primary: "boussinesq"

quality:
  on_violation: fail
  reject_nonfinite: true
  min_h_tolerance: -1e-6
  max_abs_eta_limit: 10.0
  max_velocity_limit: 50.0
  max_eta_over_depth: 1.0
  require_cg_converged: true

solver:
  nx: 64
  ny: 64
  dx: 0.015625
  dy: 0.015625
  dt: 0.001
  g: 9.81
  cfl: 0.35
  boundary: "open"
  use_sponge: true
  sponge_width: 20
  sponge_min_factor: 0.9
  alpha: 0.3333333333333333
  min_depth: 1e-4
  depth_scale: 0.02
  mode: "linear_variable_depth"
  filter_strength: 0.01
  linear_solver_tol: 1e-6
  linear_solver_max_iter: 500
  check_finite: true
