configs:
  bathymetry: "configs/data/multires/bathymetry_32.yaml"
  source: "configs/data/multires/source_32.yaml"

dataset:
  num_samples: 1000
  seed: 763
  num_workers: 10
  n_steps: 250
  save_every: 5
  auto_dt: true
  target_cfl: 0.45
  include_initial_state: true
  sea_level_offset: 0.0
  source_strength_range: [0.45, 0.85]
  bathymetry_dir: "./data/res32/bathymetry"
  source_dir: "./data/res32/sources"
  output_dir: "./data/res32/raw"
  manifest_path: "./data/res32/synthetic/scenario_manifest.jsonl"
  copy_configs: true

fdes:
  enabled: ["swe_hydrostatic", "swe_muscl_hr"]
  primary: "swe_hydrostatic"

quality:
  on_violation: fail
  reject_nonfinite: true
  min_h_tolerance: -1e-6
  max_abs_eta_limit: 10.0
  max_velocity_limit: 50.0

solver:
  nx: 32
  ny: 32
  dx: 0.03125
  dy: 0.03125
  dt: 0.001
  g: 9.81
  cfl: 0.45
  dry_tolerance: 1e-6
  max_velocity: 50.0
  boundary: "open"
  use_sponge: true
  sponge_width: 10
  sponge_min_factor: 0.9
