raw:
  scenario_manifest: data/synthetic/res64/scenario_manifest.jsonl
  fde_manifests:
    hydrostatic: data/synthetic/res64/hydrostatic_manifest.jsonl
    muscl_hr: data/synthetic/res64/muscl_hr_manifest.jsonl
  raw_dirs:
    hydrostatic: data/raw_res64/hydrostatic/samples
    muscl_hr: data/raw_res64/muscl_hr/samples

processed_dir: data/processed_res64_shared_from64

fde:
  mode: separate_all
  targets: [hydrostatic, muscl_hr]
  target_field: eta

split:
  train: 0.7
  val: 0.15
  test: 0.15
  seed: 42

input:
  use_bathymetry: true
  use_source: true
  use_initial_depth: true
  use_initial_surface: false
  use_solver_id: false

target:
  mode: multi_step
  variable: eta
  forecast_steps: 50
  stride: 1

normalization:
  method: standardize
  channels:
    bathymetry: true
    source: true
    solver_id: false
    trajectory: true
  reference_stats_by_fde:
    hydrostatic: data/processed_res64/hydrostatic/normalization_stats.json
    muscl_hr: data/processed_res64/muscl_hr/normalization_stats.json
  eps: 1e-6

saving:
  format: npy
  compress: true
  include_meta: true

eval_export:
  enabled: true
  input_order: [bathymetry, source, initial_depth, initial_surface]
  inputs_name: inputs.npy
  targets_name: targets.npy
  ids_name: sample_id.npy
  archive_name: eval_dataset.npz
  manifest_name: eval_manifest.json
