configs:
  bathymetry: "configs/data/bathymetry.yaml"
  source: "configs/data/source.yaml"

dataset:
  num_samples: 20
  seed: 42
  num_workers: 10
  n_steps: 250
  save_every: 5
  auto_dt: true
  target_cfl: 0.45
  include_initial_state: true
  sea_level_offset: 0.0
  source_strength_range: [0.5, 2.0]
  bathymetry_dir: "data/bathymetry_res64"
  source_dir: "data/sources_res64"
  output_dir: "data/raw_res64"
  manifest_path: "data/synthetic/res64/scenario_manifest.jsonl"
  copy_configs: true

fdes:
  enabled: ["swe_hydrostatic", "swe_muscl_hr"]
  primary: "swe_hydrostatic"

solver:
  nx: 64
  ny: 64
  dx: 0.015625
  dy: 0.015625
  dt: 0.001
  g: 9.81
  cfl: 0.45
  dry_tolerance: 1e-6
  max_velocity: 50.0
  boundary: "open"
  use_sponge: true
  sponge_width: 20
  sponge_min_factor: 0.9
