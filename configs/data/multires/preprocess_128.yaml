raw:
  scenario_manifest: ./data/res128/synthetic/scenario_manifest.jsonl
  fde_manifests:
    hydrostatic: ./data/res128/synthetic/hydrostatic_manifest.jsonl
    muscl_hr: ./data/res128/synthetic/muscl_hr_manifest.jsonl
    boussinesq: ./data/res128/synthetic/boussinesq_manifest.jsonl
  raw_dirs:
    hydrostatic: ./data/res128/raw/hydrostatic/samples
    muscl_hr: ./data/res128/raw/muscl_hr/samples
    boussinesq: ./data/res128/raw/boussinesq/samples

processed_dir: data/processed_res128

fde:
  mode: separate_all
  targets: [hydrostatic, muscl_hr, boussinesq]
  target_field: eta

split:
  train: 0.7
  val: 0.15
  test: 0.15
  seed: 42

input:
  use_bathymetry: true
  use_source: true
  use_initial_depth: true
  use_initial_surface: false
  use_solver_id: false

target:
  mode: multi_step
  variable: eta
  forecast_steps: 50
  stride: 1

normalization:
  method: standardize
  channels:
    bathymetry: true
    source: true
    solver_id: false
    trajectory: true
  eps: 1e-6

saving:
  format: npy
  compress: true
  include_meta: true
  sharded: true
  shard_size: 128
  write_legacy_eval_archive: false

eval_export:
  enabled: true
  input_order: [bathymetry, source, initial_depth, initial_surface]
  inputs_name: inputs.npy
  targets_name: targets.npy
  ids_name: sample_id.npy
  archive_name: eval_dataset.npz
  manifest_name: eval_manifest.json
