nx: 32
ny: 32
seed: null

source_type: ["gaussian", "multi-gauss", "okada-like", "dipole", "fault", "rough"]

gaussian:
  enabled: true
  amp_range: [0.08, 0.55]
  sigma_range: [0.015, 0.10]
  num_range: [1, 3]

multi:
  enabled: true
  num_sources: [2, 4]

okada:
  enabled: true
  length_range: [0.1, 0.6]
  width_range: [0.05, 0.30]
  slip_range: [0.10, 0.60]
  angle_range: [0.0, 3.14]
  dip_range: [0.0, 0.6]
  depth_range: [0.0, 0.30]
  smoothing_sigma: [0.05, 0.15]

dipole:
  enabled: true
  amp_range: [0.10, 0.65]
  sigma_range: [0.02, 0.12]
  separation_range: [0.05, 0.24]
  angle_range: [0.0, 3.14]

fault:
  enabled: true
  amp_range: [0.10, 0.60]
  length_range: [0.2, 0.8]
  width_range: [0.02, 0.12]
  angle_range: [0.0, 3.14]
  smoothing_sigma: [0.005, 0.015]

rough:
  enabled: true
  amp_range: [0.08, 0.45]
  smoothing_sigma: [0.2, 1.0]

noise:
  enabled: true
  scale_range: [0.005, 0.035]
  smoothing_sigma: [0.5, 1.5]

normalization:
  mode: none
  clip_output: true
  height_scale: [-1.0, 1.0]
