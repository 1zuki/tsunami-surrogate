forward_data:
  train_path: data/processed/hydrostatic/train/eval_dataset.npz
  val_path: data/processed/hydrostatic/val/eval_dataset.npz
  test_path: data/processed/hydrostatic/test/eval_dataset.npz

output_root: data/processed_inverse/hydrostatic

# input channel index inside forward inputs
source_channel_index: 1
bathymetry_channel_index: 0
initial_depth_channel_index: 2

observation:
  # final_eta / mean_eta / max_abs_eta
  mode: final_eta
  include_bathymetry: true
  include_initial_depth: false
  noise_std: 0.0
  seed: 42

