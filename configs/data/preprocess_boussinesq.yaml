raw:
  scenario_manifest: data/synthetic/scenario_manifest_bouss.jsonl
  fde_manifests:
    boussinesq: data/synthetic/boussinesq_manifest.jsonl
  raw_dirs:
    boussinesq: data/raw_bouss/boussinesq/samples

processed_dir: data/processed

fde:
  mode: single
  targets: [boussinesq]
  target_field: eta

split:
  train: 0.7
  val: 0.15
  test: 0.15
  seed: 42

input:
  use_bathymetry: true
  use_source: true
  use_initial_depth: true
  use_initial_surface: false
  use_solver_id: false

target:
  mode: multi_step
  variable: eta
  forecast_steps: 50
  stride: 1

normalization:
  method: standardize
  channels:
    bathymetry: true
    source: true
    solver_id: false
    trajectory: true
  eps: 1e-6

saving:
  format: npy
  compress: true
  include_meta: true

eval_export:
  enabled: true
  input_order: [bathymetry, source, initial_depth, initial_surface]
  inputs_name: inputs.npy
  targets_name: targets.npy
  ids_name: sample_id.npy
  archive_name: eval_dataset.npz
  manifest_name: eval_manifest.json
