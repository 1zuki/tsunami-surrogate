nx: 384
ny: 384
seed: null
source_type: ["okada-like"]

gaussian:
  enabled: false
  amp_range: [0.08, 0.55]
  sigma_range: [0.015, 0.10]
  num_range: [1, 3]

multi:
  enabled: false
  num_sources: [2, 4]

okada:
  enabled: true
  length_range: [0.1, 0.6]
  width_range: [0.05, 0.30]
  slip_range: [0.10, 0.60]
  angle_range: [0.0, 3.14]
  dip_range: [0.0, 0.6]
  depth_range: [0.0, 0.30]
  smoothing_sigma: [0.1, 0.3]
  center_x: 0.45
  center_y: 0.75

dipole:
  enabled: false
  amp_range: [0.10, 0.65]
  sigma_range: [0.02, 0.12]
  separation_range: [0.05, 0.24]
  angle_range: [0.0, 3.14]

fault:
  enabled: false
  amp_range: [0.10, 0.60]
  length_range: [0.2, 0.8]
  width_range: [0.02, 0.12]
  angle_range: [0.0, 3.14]
  smoothing_sigma: [0.01, 0.03]

rough:
  enabled: false
  model: correlated_grf
  amp_range: [0.08, 0.45]
  smoothing_sigma: [0.4, 2.0]
  correlation_length_range: [0.10, 0.20]
  rms_range: [0.05, 0.15]
  fine_amplitude_fraction: 0.0
  fine_correlation_fraction: [0.50, 0.65]
  min_fine_sigma_cells: 6.0
  add_global_noise: false

noise:
  enabled: true
  scale_range: [0.005, 0.035]
  smoothing_sigma: [1.0, 3.0]

normalization:
  mode: none
  clip_output: true
  height_scale: [-1.0, 1.0]
