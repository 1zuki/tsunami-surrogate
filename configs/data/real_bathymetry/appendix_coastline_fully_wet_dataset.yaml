configs:
  bathymetry: configs/data/bathymetry.yaml
  source: configs/data/real_bathymetry/real_bathymetry_source.yaml
dataset:
  num_samples: 1
  seed: 367
  num_workers: 1
  n_steps: 250
  save_every: 5
  auto_dt: true
  target_cfl: 0.45
  include_initial_state: true
  sea_level_offset: 0.0
  source_strength_range:
  - 0.45
  - 0.85
  bathymetry_dir: data/real_bathymetry/derived_inputs/appendix_coastline_fully_wet
  source_dir: data/real_bathymetry/sources/appendix_coastline_fully_wet
  output_dir: data/real_bathymetry/raw/appendix_coastline_fully_wet
  manifest_path: data/real_bathymetry/manifests/appendix_coastline_fully_wet/scenario_manifest.jsonl
  copy_configs: true
fdes:
  enabled:
  - swe_hydrostatic
  primary: swe_hydrostatic
quality:
  on_violation: warn
  reject_nonfinite: true
  min_h_tolerance: -1e-6
  max_abs_eta_limit: 5.0
  max_velocity_limit: 30.0
  max_eta_over_depth: 1.0
  require_cg_converged: true
solver:
  nx: 64
  ny: 64
  dx: 0.015625
  dy: 0.015625
  dt: 0.001
  g: 9.81
  rho: 1000
  cfl: 0.45
  dry_tolerance: 1e-6
  max_velocity: 30.0
  boundary: open
  use_sponge: true
  sponge_width: 20
  sponge_min_factor: 0.9
  alpha: 0.3333333333333333
  min_depth: 1e-4
  depth_scale: 1.0
  mode: linear_variable_depth
  filter_strength: 0.01
  linear_solver_tol: 1e-6
  linear_solver_max_iter: 500
  check_finite: true
