configs:
  bathymetry: "configs/data/bathymetry.yaml"
  source: "configs/data/source.yaml"

dataset:
  num_samples: 10000
  seed: 42
  num_workers: 10
  n_steps: 250
  save_every: 5
  auto_dt: true
  target_cfl: 0.45
  include_initial_state: true
  sea_level_offset: 0.0
  # Multiplier applied after source.yaml generates the source field.
  # Keep this moderate for the paper pipeline: source.yaml now caps source_field
  # near [-1, 1], so this range gives visible waves without routinely creating
  # dry/explosive shallow-water states.
  source_strength_range: [0.45, 0.85]
  bathymetry_dir: "data/bathymetry"
  source_dir: "data/sources"
  output_dir: "data/raw"
  manifest_path: "data/synthetic/scenario_manifest.jsonl"
  copy_configs: true

fdes:
  # Run all paper-facing forward solvers on the same bathymetry/source scenarios.
  # This keeps hydrostatic, MUSCL-HR, and Boussinesq targets comparable by sample ID.
  enabled: ["swe_hydrostatic", "swe_muscl_hr", "boussinesq"]
  primary: "swe_hydrostatic"

quality:
  on_violation: fail
  reject_nonfinite: true
  min_h_tolerance: -1e-6
  max_abs_eta_limit: 5.0
  max_velocity_limit: 30.0
  # Boussinesq-only health checks. These are ignored for SWE where not applicable.
  max_eta_over_depth: 1.0
  require_cg_converged: true

solver:
  nx: 64
  ny: 64
  dx: 0.015625
  dy: 0.015625
  dt: 0.001
  g: 9.81
  rho: 1000
  cfl: 0.45
  dry_tolerance: 1e-6
  max_velocity: 30.0
  boundary: "open"
  use_sponge: true
  sponge_width: 20
  sponge_min_factor: 0.9
  # Boussinesq-only knobs are ignored by the SWE solvers but needed when
  # boussinesq is enabled above.
  alpha: 0.3333333333333333
  min_depth: 1e-4
  # Use physical bathymetry depth in the shared all-solver dataset. Smaller
  # diagnostic depth scales belong in dataset_boussinesq.yaml, not here.
  depth_scale: 1.0
  mode: "linear_variable_depth"
  filter_strength: 0.01
  linear_solver_tol: 1e-6
  linear_solver_max_iter: 500
  check_finite: true
