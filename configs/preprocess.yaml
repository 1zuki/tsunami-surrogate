raw_dir: data/raw/samples
processed_dir: data/processed

manifest_path: data/synthetic/manifest.jsonl

split:
  train: 0.7
  val: 0.15
  test: 0.15
  seed: 42

input:
  use_bathymetry: true
  use_source: true
  use_initial_depth: true
  use_initial_surface: false

target:
  mode: multi_step   # or multi_step / final_state
  variable: eta      # eta / depth / state
  forecast_steps: 100
  stride: 1

normalization:
  method: standardize   # or minmax
  channels:
    bathymetry: true
    source: true
    trajectory: true
  eps: 1e-6

saving:
  format: npy
  compress: true
  include_meta: true

eval_export:
  enabled: true
  input_order: [bathymetry, source, initial_depth, initial_surface]
  inputs_name: inputs.npy
  targets_name: targets.npy
  ids_name: sample_id.npy
  archive_name: eval_dataset.npz
  manifest_name: eval_manifest.json
