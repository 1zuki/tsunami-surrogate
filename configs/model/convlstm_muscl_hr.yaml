defaults:
  - ../train/base.yaml

output_dir: experiments/convlstm_muscl_hr

data:
  train_path: data/processed/muscl_hr/train/eval_dataset.npz
  val_path: data/processed/muscl_hr/val/eval_dataset.npz
  test_path: data/processed/muscl_hr/test/eval_dataset.npz
  batch_size: 8
  num_workers: 0

model:
  name: convlstm
  in_channels: 3
  out_channels: 50
  hidden_channels: 48
  num_layers: 2
  kernel_size: 3
  context_channels: 48
  use_feedback: true

train:
  epochs: 180
  lr: 0.0005
  min_lr: 0.00005
  scheduler: cosine
  weight_decay: 1.0e-6
  grad_clip: 1.0

  loss: horizon_weighted_mse
  horizon_min_weight: 0.8
  horizon_max_weight: 2.0
  horizon_power: 1.7

  checkpoint_metric: val_rel_l2

  early_stopping:
    patience: 20
    mode: min

eval:
  dataset_path: data/processed/muscl_hr/test
  batch_size: 8
  output_dir: experiments/convlstm_muscl_hr/eval
