defaults:
  - ../train/base.yaml

# Extra ensemble members to extend the deep ensemble from M=3 to M=7.
# The original members (seeds 11, 22, 33) already live in
# experiments/ensemble/member_{seed} and are NOT retrained here.
# This config only trains the four new seeds so the existing checkpoints
# are left untouched.
output_dir: experiments/fno

model:
  name: fno2d
  in_channels: 3
  out_channels: 50
  modes1: 14
  modes2: 14
  width: 48
  depth: 6
  padding: 6
  use_grid: true

train:
  epochs: 256
  lr: 0.0005
  min_lr: 0.00005
  scheduler: cosine
  weight_decay: 1.0e-6
  grad_clip: 1.0

  loss: horizon_weighted_mse
  horizon_min_weight: 0.8
  horizon_max_weight: 2.0
  horizon_power: 1.7

  checkpoint_metric: val_rel_l2

  early_stopping:
    patience: 20
    mode: min

eval:
  dataset_path: data/processed/hydrostatic/test
  batch_size: 64
  output_dir: experiments/fno/eval

ensemble:
  seeds: [44, 55, 66, 77]
  member_dir_template: experiments/ensemble/member_{seed}
