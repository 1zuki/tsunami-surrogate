nx: 64
ny: 64
seed: null

source_type: ["gaussian", "multi-gauss", "okada-like", "dipole", "fault", "rough"]

# gaussian
gaussian:
  enabled: true
  amp_range: [0.2, 2.0]
  sigma_range: [0.01, 0.08]
  num_range: [1, 3]

# multi-source
multi:
  enabled: true
  num_sources: [1, 3]

# okada-like (complex earthquake)
okada:
  enabled: true
  length_range: [0.1, 0.4]
  width_range: [0.05, 0.2]
  slip_range: [0.5, 2.0]
  angle_range: [0.0, 3.14]
  dip_range: [0.0, 0.5]
  depth_range: [0.0, 0.2]
  smoothing_sigma: [0.1, 0.3]

# dipole (uplift + subsidence, the classic tsunami shape)
dipole:
  enabled: true
  amp_range: [0.5, 2.5]
  sigma_range: [0.02, 0.08]
  separation_range: [0.05, 0.15]
  angle_range: [0.0, 3.14]

# simple fault (long rectangular block uplift)
fault:
  enabled: true
  amp_range: [0.5, 2.0]
  length_range: [0.2, 0.6]
  width_range: [0.02, 0.08]
  angle_range: [0.0, 3.14]
  smoothing_sigma: [0.01, 0.03]

rough:
  enabled: true
  amp_range: [0.5, 2.0]
  smoothing_sigma: [0.5, 2.0]

# noise
noise:
  enabled: true
  scale_range: [0.01, 0.05]
  smoothing_sigma: [1.0, 3.0]

# normalization
height_scale: [-1.0, 1.0]