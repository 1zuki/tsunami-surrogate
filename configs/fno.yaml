base_config: base.yaml

project:
  name: tsunami-fno

paths:
  output_root: results/fno_run
  checkpoint_dir: results/fno_run/checkpoints
  log_dir: results/fno_run/logs
  figure_dir: results/fno_run/figures
  dataset_dir: data/synthetic/fno_default
  train_file: data/synthetic/fno_default/train.npz
  val_file: data/synthetic/fno_default/val.npz
  test_file: data/synthetic/fno_default/test.npz
  stats_file: data/synthetic/fno_default/stats.yaml

model:
  name: fno
  hidden_channels: 8
  modes_x: 6
  modes_y: 6
  n_layers: 1
  padding: 4
  dropout: 0.10

training:
  epochs: 60
  batch_size: 1
  lr: 0.001

loss:
  mse_weight: 1.0
  gradient_weight: 0.05
  temporal_weight: 0.02
  mass_weight: 0.02
