alignment_contract:
  config_path: configs/eval/common_time_alignment.yaml
  suite: full
  audit_artifact_path: results/common_time_validation/audit/paired_reference_audit.json
  scenario_selection_path: configs/eval/common_time_validation_scenarios.json
  dense_validation_decision_path: results/common_time_validation/dense_reference_validation/dense_validation/decision.json
  require_full_suite_dense_decision: true
  dense_fallback_policy: unsupported

direction:
  name: boussinesq_to_hydrostatic
  model_solver: boussinesq
  benchmark_solver: hydrostatic
  model_config: configs/model/fno_boussinesq.yaml
  checkpoint: experiments/fno_boussinesq/best.pt
  model_raw_root: data/raw/boussinesq/samples
  benchmark_raw_root: data/raw/hydrostatic/samples
  model_processed_test_path: data/processed/boussinesq/test/eval_dataset.npz
  model_normalization_stats_path: data/processed/boussinesq/normalization_stats.json

evaluation:
  batch_size: 8
  bootstrap_seed: 20260711
  num_resamples: 10000
  confidence_level: 0.95
  reconstruction_atol: 1.0e-6

output_path: results/common_time_validation/emulator_superiority/boussinesq_to_hydrostatic.json
