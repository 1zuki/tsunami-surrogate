defaults:
  - ../model/ffno.yaml

eval:
  output_dir: experiments/ffno/eval_real_bathymetry
  report_physical_metrics: true
  real_resolution:
    normalization_policy: require_target_stats_match
    normalization_mismatch: fail
    checkpoint_reference_mismatch: fail
    normalization_reference_path: data/processed/hydrostatic/train
    checkpoint_train_path: data/processed/hydrostatic/train
    normalization_tol: 1.0e-6
    suites:
      - label: main_morphology_suite_10
        path: data/processed_real_bathymetry_v2/main_morphology_suite_10/hydrostatic/test
        batch_size: 1
      - label: main_morphology
        path: data/processed_real_bathymetry_v2/main_morphology/hydrostatic/test
        batch_size: 1
      - label: appendix_coastline_fully_wet
        path: data/processed_real_bathymetry_v2/appendix_coastline_fully_wet/hydrostatic/test
        batch_size: 1
      - label: appendix_coastline_stress
        path: data/processed_real_bathymetry_v2/appendix_coastline_stress/hydrostatic/test
        batch_size: 1
