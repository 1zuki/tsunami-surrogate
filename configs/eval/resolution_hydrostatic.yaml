defaults:
  - ../model/fno.yaml

eval:
  output_dir: experiments/fno/eval_resolution
  report_physical_metrics: true
  real_resolution:
    normalization_policy: require_target_stats_match
    normalization_mismatch: fail
    normalization_reference_path: data/processed/hydrostatic/train/eval_dataset.npz
    normalization_tol: 1e-6
    suites:
      - label: res32_hydrostatic
        path: data/processed_res32/hydrostatic/test
      - label: res64_hydrostatic
        path: data/processed_res64/hydrostatic/test
      - label: res128_hydrostatic
        path: data/processed_res128/hydrostatic/test
