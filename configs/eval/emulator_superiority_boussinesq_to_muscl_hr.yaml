model_config: configs/model/fno_boussinesq.yaml
checkpoint: experiments/fno_boussinesq/best.pt

evaluation:
  # Cross-reference: Boussinesq-trained FNO scored against the MUSCL-HR targets
  # (same input scenarios, different solver). Like-for-like numerator for
  # rho = RMSE(f_bouss, ref muscl_hr) / RMSE(ref bouss, ref muscl_hr).
  dataset_path: data/processed/muscl_hr/test/eval_dataset.npz
  batch_size: 8
  report_physical_metrics: true

solver_compare_path: results/solver_compare_boussinesq_vs_muscl_hr.json

ratio:
  numerator_metric: rmse_physical_separate_denorm
  denominator_metric: rmse

normalization:
  on_signature_mismatch: warn
  tol: 1e-6

output_path: results/emulator_superiority_boussinesq_to_muscl_hr.json
