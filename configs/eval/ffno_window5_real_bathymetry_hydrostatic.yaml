defaults:
  - ../model/ffno_window5_hydrostatic.yaml

eval:
  output_dir: experiments/ffno_window5_hydrostatic/eval_real_bathymetry
  report_physical_metrics: true
  window_suites:
    - label: main_morphology_suite_10
      path: data/processed_real_bathymetry/main_morphology_suite_10/hydrostatic/test
      batch_size: 1
    - label: main_morphology
      path: data/processed_real_bathymetry/main_morphology/hydrostatic/test
      batch_size: 1
    - label: appendix_coastline_stress
      path: data/processed_real_bathymetry/appendix_coastline_stress/hydrostatic/test
      batch_size: 1
    - label: appendix_coastline_fully_wet
      path: data/processed_real_bathymetry/appendix_coastline_fully_wet/hydrostatic/test
      batch_size: 1
