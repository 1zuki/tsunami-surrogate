defaults:
  - ../model/fno_boussinesq.yaml

eval:
  output_dir: experiments/fno_boussinesq/eval_ood_suites
  report_physical_metrics: true
  generalization:
    suites:
      - label: source_holdout_multi_gauss
        path: data/processed_ood/boussinesq/source_holdout_multi_gauss
        group_key: source_type
      - label: bathymetry_holdout_trench
        path: data/processed_ood/boussinesq/bathymetry_holdout_trench
        group_key: bathymetry_type
      - label: source_strength_extreme_high
        path: data/processed_ood/boussinesq/source_strength_extreme_high
        group_key: source_type
